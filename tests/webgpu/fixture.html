<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>sculptcore WebGPU render fixture</title>
  <style>
    html, body { margin: 0; background: #1a1c21; }
    #canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas" width="512" height="512"></canvas>
  <script type="module">
    import { bootAndRender } from './bootstrap.js'

    window.__renderReady = false
    window.__renderError = null

    try {
      const { ok } = await bootAndRender(512, 512)
      if (!ok) {
        throw new Error('webgpuRenderScene returned 0 (device/surface not ready)')
      }
      window.__renderReady = true
    } catch (err) {
      window.__renderError = String(err && err.stack ? err.stack : err)
      console.error(err)
    }
  </script>
</body>
</html>
